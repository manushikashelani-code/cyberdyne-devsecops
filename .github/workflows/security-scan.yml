name: Comprehensive Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  iac-and-compose-linter:
    name: Dockerfile & Docker Compose IaC Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Hadolint checks Dockerfile best practices (catches base image bloat, root usage, expose ports)
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
        continue-on-error: true

      # 2. Trivy Config Scan with explicit IaC framework targeting for Docker Compose
      - name: Run Trivy Misconfiguration Scan on Compose & Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          tf-vars: ''
          hide-progress: false
          format: 'table'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

  container-cve-scan:
    name: Scan Built Base Image for OS Bloat CVEs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Container Image
        run: |
          docker build -t vulnerable-app:test .

      # 3. Trivy Image Scan (Scans the built python:3.11 layers to reveal hundreds of bloat-related CVEs)
      - name: Scan Built Image for OS & Package Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'vulnerable-app:test'
          hide-progress: false
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'