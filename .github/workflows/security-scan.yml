name: Comprehensive Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  sast-and-dependency-scan:
    name: Code & Dependency Security (Bandit & Trivy FS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python SAST Scan (Bandit)
        run: |
          pip install bandit
          bandit -r app/ -f txt || true

      - name: Run Dependency & Secrets Scan (Trivy FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          hide-progress: false
          format: 'table'
          severity: 'HIGH,CRITICAL,MEDIUM'
          exit-code: '0'

  iac-misconfig-scan:
    name: Infrastructure-as-Code Scan (Trivy Config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan Dockerfile & Docker Compose
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-progress: false
          format: 'table'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

  container-image-vulnerability-scan:
    name: Container Base Image & CVE Scan (Trivy Image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Container Image for Scanning
        run: |
          docker build -t vulnerable-app:test .

      - name: Scan Built Image for OS & Software CVEs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'vulnerable-app:test'
          hide-progress: false
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'