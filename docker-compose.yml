version: '3.8'

networks:
  backend-net:
    driver: bridge
    internal: false # Internal bridge network for isolated service communication

services:
  web-api:
    build:
      context: .
      dockerfile: Dockerfile
    # VULNERABILITY FIX: Bind strictly to localhost on host machine
    ports:
      - "127.0.0.1:8080:8080"
    # VULNERABILITY FIX: Removed privileged: true
    environment:
      - REDIS_HOST=broker
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secure_admin_password_987}
    depends_on:
      - broker
    networks:
      - backend-net

  broker:
    # VULNERABILITY FIX: Pinned version instead of mutable 'latest' tag
    image: redis:7.2-alpine
    # VULNERABILITY FIX: Removed public port exposure (6379:6379) to host network
    command: redis-server --requirepass ${REDIS_PASSWORD:-secure_admin_password_987}
    networks:
      - backend-net